<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Playground</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-label="gesture playground">
      <video id="camera" class="camera" playsinline muted></video>
      <canvas id="stage" aria-label="interactive falling shape canvas"></canvas>

      <section class="hud" aria-label="controls">
        <div class="status-row" aria-live="polite">
          <span id="cameraStatus" class="status-chip">Camera off</span>
          <span id="gestureStatus" class="status-chip status-chip--hot">Pinch ready</span>
        </div>
      </section>

      <section class="dock" aria-label="action controls">
        <button id="cameraButton" class="icon-button" type="button" title="Camera">
          <span class="icon icon-camera" aria-hidden="true"></span>
          <span class="sr-only">Camera</span>
        </button>
        <button id="clearButton" class="reset-button" type="button" title="Reset">
          Reset
        </button>
      </section>

      <aside class="lens" aria-hidden="true">
        <canvas id="lensCanvas"></canvas>
      </aside>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
